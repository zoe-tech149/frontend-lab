<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Income Tax Estimator</title>

    <link rel="stylesheet" href="style.css">

  </head>

  <body>

    <main>

      <h1>Income Tax Estimator</h1>

      <p>Estimate your annual income tax in South Africa.</p>

      <div class="input-left-panel">
        <label for="annual-tax-income">
          Annual taxable income(R):
          <input 
            type="number"
            id="anual-tax-income"
            >
        </label>

        <button>Calculate tax</button>
      </div>

      <div class="results-right-panel">

        <label for="estimated-annual-tax">
          Estimated annual tax:
          <p id="estimated-annual-tax"></p>
        </label>

        <hr>

        <label for="income-after-tax">
          Income after estimated tax:
          <p id="income-after-tax"></p>
        </label>

      </div>

      <p>Taxpayer is an individual under 65 years, eliible for primary reebate and have no deductions or tax credits.</p>

    </main>
    
    <script src="script.js"></script>
   
  </body>

</html>
