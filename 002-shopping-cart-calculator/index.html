<!DOCTYPE html>

<html lang="en">
  
  <head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Shopping Cart Calculator</title>

    <link rel="stylesheet" href="style.css"/>
    
  </head>
  
  <body>

    <main>

      <header>
        
        <h1>Petals & Stems</h1>
        
        <p>A charming neighborhood florist where classic elegance meets fresh, modern design.</p>
      
      </header>

      <section>

        <h2>Shopping Cart</h2>

        <article>

          <p>Sunflower</p>

          <img src="images/sunflower.jpg" alt="Stems of Sunflowers " />

          <p>Bright • 10 stems</p>

          <p>R2400</p>

          <button id="decreaseQuantityBtn1">-</button>
          <span id="quantityValue1">1</span>
          <button id="increaseQuantityBtn1">+</button>

          <p id="product1Subtotal"></p>
          
        </article>

        <article>

          <p>Lilies</p>

          <img src="images/lilies.jpg" alt="A bunch of Lilies flowers" />

          <p>Elegant • bunch of 10</p>

          <p>R1500</p>

          <button id="decreaseQuantityBtn2">-</button>
          <span id="quantityValue2">1</span>
          <button id="increaseQuantityBtn2">+</button>
    
          <p id="product2Subtotal"></p>

          <button>Remove</button>
          
        </article>

        <article>

          <p>Tulips</p>

          <img src="images/tulips.jpg" alt="A bouquet of Tulips flowers" />

          <p>Cup-shaped • bouquet</p>

          <p>R2000</p>

          <button id="decreaseQuantityBtn3">-</button>
          <span id="quantityValue3">1</span>
          <button id="increaseQuantityBtn3">+</button>

          <p id="product3Subtotal"></p>

          <button>Remove</button>

        </article>

      </section>

      <section>

        <h2>Order Summary</h2>


        <p>Total: <span id="finalTotal"></span></p>

      </section>

    </main>
    
    <script src="script.js"></script>
  
  </body>
  
</html>
